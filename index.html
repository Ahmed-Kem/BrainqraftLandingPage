    <script>
      // Journey invitation links (/join/BQ-XXXXXX). When the app is installed the OS
      // opens it via Universal / App Links before this page loads, so this only runs
      // for visitors WITHOUT the app: send mobile users to their store. The code in
      // the path is picked up by the app after install; nothing to parse here.
      (function () {
        if (!/^\/join(\/|$)/.test(location.pathname)) return;
        var APP_STORE_URL = "https://apps.apple.com/app/id6760896800";
        var PLAY_STORE_URL = "https://play.google.com/store/apps/details?id=com.brainqraft.mobileapp";
        var ua = navigator.userAgent || "";
        if (/android/i.test(ua)) location.replace(PLAY_STORE_URL);
        else if (/iphone|ipad|ipod/i.test(ua)) location.replace(APP_STORE_URL);
        else document.documentElement.classList.add("is-join");
      })();
    </script>
